name: Release

# Push a tag like v2.0.0 to publish a GitHub release with the Windows
# installer, the portable zip and install.sh. Running the workflow by hand
# builds the same files as a downloadable artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ("${{ github.ref_type }}" -ne "tag") { $version = "" }
          .\packaging\windows\build.ps1 -Version $version
      - name: Smoke test the build
        shell: pwsh
        run: |
          .\dist\limpaper\limpaper-cli.exe --version
          .\dist\limpaper\limpaper-cli.exe doctor
      - uses: actions/upload-artifact@v4
        with:
          name: limpaper-windows
          path: |
            dist/limpaper-setup-windows-x64.exe
            dist/limpaper-windows-x64-portable.zip

  publish:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: limpaper-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/limpaper-setup-windows-x64.exe
            dist/limpaper-windows-x64-portable.zip
            install.sh
