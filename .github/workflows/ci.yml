name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[tui]" pytest
      - name: Tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          limpaper --version
          limpaper --help
          limpaper doctor

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install ".[all]" pytest
      - name: GUI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_gui.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh

  # Builds the same installer and zip as a release, so every push can be tried
  # on Windows from the run's artifacts before anything is published.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\packaging\windows\build.ps1
      - name: Smoke test the build
        shell: pwsh
        run: |
          .\dist\limpaper\limpaper-cli.exe --version
          .\dist\limpaper\limpaper-cli.exe doctor
          if (-not (Test-Path .\dist\limpaper\mpv\mpv.exe)) { Write-Warning "mpv was not bundled" }
      - uses: actions/upload-artifact@v4
        with:
          name: limpaper-windows-${{ github.sha }}
          path: |
            dist/limpaper-setup-windows-x64.exe
            dist/limpaper-windows-x64-portable.zip
